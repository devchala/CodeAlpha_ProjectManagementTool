<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="TaskFlow: manage projects and tasks with your team."><title>Log in | TaskFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body ><header id="nav"></header><main>
<div class="auth"><h1>Log in</h1><form class="card" id="authForm" data-mode="login" novalidate>
<div class="f"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></div>
<div class="f"><label for="pw">Password</label><div class="pw"><input type="password" id="pw" name="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="eye"></button></div></div>
<p class="err" id="err" role="alert"></p><button class="btn">Log in</button></form>
<p class="mute">New here? <a href="register.html">Create an account</a></p></div>
</main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
