<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="TaskFlow: manage projects and tasks with your team."><title>Tasks | TaskFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body data-private><header id="nav"></header><main>
<div class="head"><h1>Tasks</h1><p>Add tasks and move them across the board.</p></div>
<form class="card" id="tf"><div class="fields"><label>Task title<input name="title" required maxlength="120"></label><label>Project<select name="project" id="proj" required></select></label><label>Priority<select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label>Due date<input type="date" name="dueDate"></label></div><div><button class="btn">Add task</button></div></form>
<div class="row" style="margin-bottom:1rem"><h2>Board</h2><label style="min-width:200px">Show project<select id="filter"></select></label></div>
<div class="board" id="board"></div>
</main><script src="js/app.js"></script><script src="js/tasks.js"></script></body></html>
