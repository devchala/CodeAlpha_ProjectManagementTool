<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="TaskFlow: manage projects and tasks with your team."><title>Dashboard | TaskFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body data-private><header id="nav"></header><main>
<div class="head"><h1 id="hi" class="rise">Dashboard</h1><p id="ptxt" class="rise" style="--d:60ms">Here is where your work stands.</p>
<div class="rise" style="--d:160ms"><div class="prog" id="pbar" role="progressbar" aria-label="Overall completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div><small id="pct">0% complete</small></div></div>
<div class="stats" id="stats"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<div class="dash"><section class="rise" style="--d:600ms"><div class="row head"><h2>Recent tasks</h2><div class="tb"><select id="pf" aria-label="Filter by priority"><option value="">All</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select><div class="vt" role="group" aria-label="View"><button data-v="list">List View</button><button data-v="board">Board View</button></div><button class="btn sm" data-add>+ Add Task</button></div></div><div class="list" id="recent"><div class="sk"></div><div class="sk"></div></div></section>
<aside class="rise" style="--d:720ms"><h2 class="head">Recent activity</h2><div class="card"><ol class="tl" id="act"><li class="sk"></li></ol></div></aside></div>
</main><script src="js/app.js"></script><script src="js/dashboard.js"></script></body></html>
