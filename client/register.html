<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="TaskFlow: manage projects and tasks with your team."><title>Create account | TaskFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body ><header id="nav"></header><main>
<div class="auth"><h1>Create account</h1><form class="card" id="authForm" data-mode="register" novalidate>
<div class="f"><label for="name">Name</label><input id="name" name="name" placeholder="Your full name" autocomplete="name" required></div>
<div class="f"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></div>
<div class="f"><label for="pw">Password</label><div class="pw"><input type="password" id="pw" name="password" placeholder="Create a strong password" autocomplete="new-password" required><button type="button" class="eye"></button></div></div>
<div class="meter" aria-hidden="true"><i id="bar"></i></div><p id="lvl" class="mute" aria-live="polite"></p><ul class="rules" id="rules"></ul>
<label class="chk"><input type="checkbox" id="agree"><span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms and Privacy Policy</a></span></label>
<p class="err" id="err" role="alert"></p><button class="btn" disabled>Create account</button></form>
<p class="mute">Already registered? <a href="login.html">Log in</a></p></div>
</main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
