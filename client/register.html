<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="TaskFlow: manage projects and tasks with your team."><title>Create account | TaskFlow</title><link rel="stylesheet" href="css/style.css"></head>
<body ><header id="nav"></header><main>
<div class="auth"><h1>Create account</h1><form class="card" id="authForm" data-mode="register"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="6" autocomplete="new-password" required></label><p class="err" id="err" role="alert"></p><button class="btn">Create account</button></form><p class="mute">Already registered? <a href="login.html">Log in</a></p></div>
</main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
